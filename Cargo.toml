[package]
name = "terminal-todos"
version = "1.4.0"
edition = "2024"
rust-version = "1.89"
description = "A keyboard-first terminal todo dashboard"
repository = "https://github.com/TemelGunaydin/terminal-todos"

[[bin]]
name = "todo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
tempfile = "3"
unicode-segmentation = "1.13"
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true
